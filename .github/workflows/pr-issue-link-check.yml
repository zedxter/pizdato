name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for Issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e

          # Check body starts with Closes/Fixes/Resolves for GitHub formal linking
          if echo "$PR_BODY" | head -1 | grep -qiE '^(Closes|Fixes|Resolves) #[0-9]+'; then
            echo "✅ PR #$PR_NUMBER has formal Issue reference as body's FIRST line."
            exit 0
          fi

          # Also allow Closes/Fixes/Resolves anywhere in body
          if echo "$PR_BODY" | grep -qiE '^(Closes|Fixes|Resolves) #[0-9]+'; then
            echo "✅ PR #$PR_NUMBER has Issue reference in body."
            exit 0
          fi

          echo "❌ PR #$PR_NUMBER is missing a formal Issue reference."
          echo ""
          echo "Every PR MUST reference its Issue in the description body with a GitHub-recognized keyword:"
          echo "  Closes #N    — when this PR fully resolves the Issue (MERGE triggers Issue close)"
          echo "  Fixes #N    — alias for Closes"
          echo "  Resolves #N — alias for Closes"
          echo ""
          echo "NOTE: 'Refs #N' and 'Partially addresses #N' are NOT recognized by GitHub."
          echo "The FIRST line of the body MUST be 'Closes #N' for the auto-close to work."
          echo ""
          echo "Please edit the PR description to start with 'Closes #N'."
          exit 1