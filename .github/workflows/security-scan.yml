name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        run: |
          # Install gitleaks if not present
          if ! command -v gitleaks &>/dev/null; then
            curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o /tmp/gitleaks
            chmod +x /tmp/gitleaks
            export PATH="/tmp:$PATH"
          fi
          gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-opts=--no-merges --first-parent HEAD || exit_code=$?
          if [ "${exit_code:-0}" = "2" ]; then
            echo "::error::Gitleaks detected secrets in the code."
            exit 2
          fi
          echo "::notice::No secrets found."