name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (cargo)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install minimal Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add clippy
        run: rustup component add clippy

      - name: Add rustfmt
        run: rustup component add rustfmt

      - name: Check
        working-directory: backend
        run: cargo check --workspace

      - name: Clippy
        working-directory: backend
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        working-directory: backend
        run: cargo fmt --check

      - name: Test
        working-directory: backend
        run: cargo test --workspace

      - name: Setup Node for cron rendering tests
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Test evening cron runner
        run: |
          rustfmt --check deploy/evening/test/runner.rs
          rustc --test deploy/evening/test/runner.rs -o /tmp/pizdato-evening-tests
          /tmp/pizdato-evening-tests
          bash -n deploy/evening/run.sh
          bash -n deploy/evening/tick.sh
          rustfmt --check deploy/morning/test/runner.rs
          rustc --test deploy/morning/test/runner.rs -o /tmp/pizdato-morning-tests
          /tmp/pizdato-morning-tests
          bash -n deploy/morning/run.sh

  frontend:
    name: Frontend (npm)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  channel:
    name: Channel (Node 18)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: deploy/channel/package-lock.json
      - name: Install
        working-directory: deploy/channel
        run: npm ci
      - name: Test generation
        working-directory: deploy/channel
        run: npm test
      - name: Test evening validation and Composio boundaries
        run: node --test deploy/evening/test/*.test.mjs deploy/morning/test/agent.test.mjs deploy/editorial/test/*.test.mjs

  design-eval:
    name: Design Eval (css vs spec)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --user pyyaml -q

      - name: Design Eval
        run: python3 design-evals/design-eval.py

  design-md-lint:
    name: DESIGN.md Lint
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --user pyyaml -q

      - name: Lint DESIGN.md
        run: python3 .github/design-md-lint.py
