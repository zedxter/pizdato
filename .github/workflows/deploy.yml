name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-deploy-${{ hashFiles('**/Cargo.lock') }}
      - name: Install minimal Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        working-directory: backend
        run: cargo check --workspace
      - name: Test
        working-directory: backend
        run: cargo test --workspace

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: "ghcr.io/zedxter/pizdato-backend:sha-${{ github.sha }},ghcr.io/zedxter/pizdato-backend:latest"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/deploy.sh,deploy/compose.yaml"
          target: /srv/pizdato
          strip_components: 0
      - name: Run deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: "APP_TAG=sha-${{ github.sha }} bash /srv/pizdato/deploy/deploy.sh"