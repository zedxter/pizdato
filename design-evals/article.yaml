# Article page — single-column layout with hero and eyebrow
# Source: DESIGN.md (version alpha) + design.css
scenario: article
description: "Article/essay page: single-column layout, hero section with eyebrow label, title, subtitle, content sections"
viewport:
  width: 1280
  height: 800

checks:
  # ── Page background ─────────────────────────────────────────
  - selector: ".page"
    expected:
      background: "radial-gradient(120% 80% at 10% -10%, #1c3a2c 0%, transparent 55%), radial-gradient(90% 70% at 100% 0%, #3a1512 0%, transparent 50%), linear-gradient(160deg, var(--color-neutral), var(--color-primary) 60%)"
      display: flex
      flex-direction: column
      min-height: 100dvh
    tolerance:
      background: "exact"

  # ── Section base ────────────────────────────────────────────
  - selector: ".section"
    expected:
      width: 100%
      max-width: var(--content-max-width)
      margin-inline: auto
      padding: var(--spacing-md)
    tolerance:
      max-width: "0.5rem"

  # ── Section dark variant ────────────────────────────────────
  - selector: ".section-dark"
    expected:
      background: var(--color-primary)
    tolerance:
      background: "exact"

  # ── Section light variant ───────────────────────────────────
  - selector: ".section-light"
    expected:
      background: var(--color-neutral)
    tolerance:
      background: "exact"

  # ── Hero container ──────────────────────────────────────────
  - selector: ".hero"
    expected:
      display: flex
      flex-direction: column
      align-items: center
      justify-content: center
      text-align: center
      max-width: var(--content-max-width)
      padding: var(--hero-padding)
    tolerance:
      max-width: "0.5rem"

  # ── Hero eyebrow (article label/category) ───────────────────
  - selector: ".hero-eyebrow"
    expected:
      font-size: var(--font-eyebrow)
      letter-spacing: 0.28em
      text-transform: uppercase
      color: var(--color-secondary)
    tolerance:
      font-size: "0.05rem"
      letter-spacing: "0.02em"

  # ── Hero title (article headline) ───────────────────────────
  - selector: ".hero-title"
    expected:
      font-family: var(--font-display)
      font-weight: 400
      font-size: var(--font-display-hero)
      line-height: 0.85
      letter-spacing: 0.02em
      text-transform: lowercase
      color: transparent
    tolerance:
      font-family: "exact"
      font-size: "0.5rem"
      color: "exact"

  # ── Hero subtitle (article lede) ────────────────────────────
  - selector: ".hero-subtitle"
    expected:
      margin: "1.25rem auto 0"
      max-width: "28rem"
      font-size: var(--font-body-lg)
      font-weight: 600
      line-height: 1.35
      color: var(--color-on-primary)
    tolerance:
      max-width: "0.5rem"
      font-size: "0.05rem"

  # ── Card as content block within article ────────────────────
  - selector: ".card"
    expected:
      border: "1px solid var(--color-line)"
      border-radius: var(--radius-card)
      background: "rgba(8, 14, 11, 0.45)"
    tolerance:
      border-radius: "1px"
      background: "exact"

  # ── Card title in article body ──────────────────────────────
  - selector: ".card-title"
    expected:
      font-size: var(--font-h2)
      font-weight: 800
      line-height: 1.3
      color: var(--color-on-primary)
    tolerance:
      font-size: "0.1rem"

  # ── Card body text ──────────────────────────────────────────
  - selector: ".card-body"
    expected:
      font-size: var(--font-body-md)
      font-weight: 600
      line-height: 1.45
      color: var(--color-on-primary)
      opacity: 0.9
    tolerance:
      font-size: "0.05rem"
      opacity: "0.05"

  # ── Grid-2 layout (used in article side-by-side) ────────────
  - selector: ".grid-2"
    expected:
      display: grid
      grid-template-columns: "repeat(2, 1fr)"
      gap: var(--spacing-md)
      max-width: var(--content-max-width)
    tolerance:
      gap: "2px"
      max-width: "0.5rem"

  # ── Responsive: hero actions buttons full width on mobile ───
  - selector: "@media (max-width: 720px) .hero-actions .btn"
    expected:
      width: 100%
    tolerance:
      width: "1px"